<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background ground shadow -->
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Blue clock gradient -->
    <linearGradient id="clockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056F6"/>
      <stop offset="45%" stop-color="#0A3CB8"/>
      <stop offset="100%" stop-color="#061B56"/>
    </linearGradient>

    <!-- Bell glossy gradient -->
    <linearGradient id="bellGloss" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1A6CFF"/>
      <stop offset="50%" stop-color="#0940BD"/>
      <stop offset="100%" stop-color="#061E5E"/>
    </linearGradient>

    <!-- Orange sunrise dynamic orbit gradient -->
    <linearGradient id="sunriseOrange" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FF5A00"/>
      <stop offset="50%" stop-color="#FF8200"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <linearGradient id="rayOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA300"/>
      <stop offset="100%" stop-color="#FF6700"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Soft Blue Ground Shadow -->
  <ellipse cx="496" cy="564" rx="150" ry="16" fill="url(#shadowGlow)"/>

  <!-- 2. Alarm Clock Feet -->
  <path d="M388 510 L380 550 C378 558 384 564 392 563 L416 558 C423 556 427 550 426 542 L422 505 Z" fill="#071946"/>
  <path d="M598 505 L594 542 C593 550 597 556 604 558 L628 563 C636 564 642 558 640 550 L632 510 Z" fill="#071946"/>

  <!-- 3. Top Bells & Hammer -->
  <!-- Left Bell -->
  <path d="M394 252 C356 220 342 165 372 135 C404 104 456 122 478 162 L430 216 Z" fill="url(#bellGloss)"/>
  <ellipse cx="404" cy="170" rx="30" ry="12" transform="rotate(-36 404 170)" fill="#448BFF" opacity="0.35"/>

  <!-- Right Bell -->
  <path d="M626 252 C664 220 678 165 648 135 C616 104 564 122 542 162 L590 216 Z" fill="url(#bellGloss)"/>
  <ellipse cx="616" cy="170" rx="30" ry="12" transform="rotate(36 616 170)" fill="#448BFF" opacity="0.35"/>

  <!-- Top Stem & Button -->
  <rect x="498" y="145" width="24" height="28" rx="6" fill="#071946"/>
  <rect x="480" y="140" width="60" height="15" rx="7.5" fill="#071946"/>

  <!-- 4. Main Clock Body -->
  <!-- Outer Housing -->
  <circle cx="510" cy="350" r="168" fill="url(#clockBlue)"/>
  <circle cx="510" cy="350" r="168" fill="none" stroke="#051642" stroke-width="10"/>

  <!-- White Inner Clock Face -->
  <circle cx="510" cy="350" r="132" fill="#FFFFFF"/>
  <circle cx="510" cy="350" r="132" fill="none" stroke="#E1ECFF" stroke-width="8"/>

  <!-- Hour Indicators (12, 3, 6, 9) -->
  <rect x="506" y="234" width="8" height="18" rx="4" fill="#88A8EA"/>
  <rect x="506" y="448" width="8" height="18" rx="4" fill="#88A8EA"/>
  <rect x="394" y="346" width="18" height="8" rx="4" fill="#88A8EA"/>
  <rect x="608" y="346" width="18" height="8" rx="4" fill="#88A8EA"/>

  <!-- Hands -->
  <!-- Hour Hand (~10 o'clock) -->
  <path d="M510 350 L442 305" stroke="#071946" stroke-width="18" stroke-linecap="round"/>
  <!-- Minute Hand (~2 o'clock) -->
  <path d="M510 350 L574 278" stroke="#071946" stroke-width="18" stroke-linecap="round"/>

  <!-- Center Pivot Cap (Orange) -->
  <circle cx="510" cy="350" r="15" fill="#FF8C00"/>
  <circle cx="510" cy="350" r="15" fill="none" stroke="#071946" stroke-width="4"/>

  <!-- 5. 3D Energetic Sunrise Orbit Ribbon (Sweeps around clock) -->
  <path d="M302 445 C300 488 340 528 418 535 C520 544 635 480 674 380 C688 344 686 312 670 292 C678 300 686 315 684 336 C678 396 612 470 500 508 C398 542 322 522 304 472 C299 458 299 448 302 445 Z" fill="url(#sunriseOrange)"/>

  <!-- 6. Wake-Up Soundwave Rays (Top Right) -->
  <g fill="url(#rayOrange)">
    <!-- Top Ray -->
    <path d="M642 98 L658 52 C661 44 672 48 676 56 L694 66 C701 70 697 80 690 88 L666 112 Z"/>
    <!-- Middle Ray -->
    <path d="M685 140 L726 114 C734 109 742 118 738 126 L730 144 C727 151 716 153 708 149 L680 156 Z"/>
    <!-- Lower Ray -->
    <path d="M698 184 L746 182 C755 182 757 194 750 198 L724 212 C716 216 706 210 706 202 Z"/>
  </g>

  <!-- 7. Typography: Alba -->
  <g fill="#071946" transform="translate(0, 10)">
    <!-- 'A' with custom orange counter triangle -->
    <path d="M374 740 L318 740 L394 580 C398 572 408 572 412 580 L488 740 L432 740 L418 708 L388 708 Z M403 624 L384 668 L422 668 Z"/>
    <polygon points="403,636 386,674 420,674" fill="#FF8C00"/>

    <!-- 'l' -->
    <rect x="474" y="572" width="28" height="168" rx="14" fill="#071946"/>

    <!-- 'b' -->
    <path d="M528 572 L554 572 L554 620 C564 606 580 598 600 598 C636 598 664 628 664 669 C664 710 636 740 600 740 C580 740 564 732 554 718 L554 740 L528 740 Z M596 626 C574 626 554 644 554 669 C554 694 574 712 596 712 C618 712 638 694 638 669 C638 644 618 626 596 626 Z"/>

    <!-- 'a' -->
    <path d="M688 669 C688 628 716 598 752 598 C772 598 788 606 798 620 L798 602 L824 602 L824 740 L798 740 L798 718 C788 732 772 740 752 740 C716 740 688 710 688 669 Z M756 626 C734 626 714 644 714 669 C714 694 734 712 756 712 C778 712 798 694 798 669 C798 644 778 626 756 626 Z"/>
  </g>

  <!-- 8. Subtitle: — Smart Alarm — -->
  <g transform="translate(0, 15)">
    <!-- Left Dash -->
    <line x1="250" y1="805" x2="295" y2="805" stroke="#4671C9" stroke-width="6" stroke-linecap="round"/>

    <!-- "Smart" -->
    <text x="320" y="818" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#071946" letter-spacing="1.5">Smart</text>

    <!-- "Alarm" -->
    <text x="515" y="818" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#FF7300" letter-spacing="1.5">Alarm</text>

    <!-- Right Dash -->
    <line x1="710" y1="805" x2="755" y2="805" stroke="#4671C9" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
